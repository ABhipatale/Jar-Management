<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d45d8" />
    <meta name="description" content="EasyJar – जार व्यवस्थापन" />
    <!-- EasyJar favicon; after login src/lib/branding.js swaps in the company's logo if it has one -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Install: the manifest is served per company by the API (src/lib/branding.js switches it after login). -->
    <link rel="manifest" href="/api/manifest.webmanifest" />

    <!-- iPhone: install to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EasyJar" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Inter (Latin) + Noto Sans Devanagari (Marathi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>EasyJar</title>
    <script>
      // Before first paint: dark mode (same rule as src/lib/theme.js), and the saved company's
      // manifest/title (same data as src/lib/branding.js) so an installed company app keeps its
      // own install name and icon. The splash below is always EasyJar's own.
      try {
        var t = localStorage.getItem('rws_theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var b = JSON.parse(localStorage.getItem('rws_branding') || 'null');
        if (b) {
          document.title = (localStorage.getItem('rws_lang') !== 'en' && b.name_mr) || b.name;
          var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el && val) el.setAttribute(attr, val); };
          set('link[rel="manifest"]', 'href', b.manifest_url);
          set('link[rel="apple-touch-icon"]', 'href', b.icons && b.icons['apple-touch']);
          set('meta[name="apple-mobile-web-app-title"]', 'content', b.short_name);
          if (b.logo_url && b.icons) {
            document.querySelectorAll('link[rel="icon"]').forEach(function (el) { el.setAttribute('href', b.icons['icon-192']); });
          }
        }
      } catch (e) {}
    </script>
    <style>
      /* EasyJar splash, shown instantly while the app loads (also on iPhone, which has no manifest splash). */
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f5f6f8; font-family: system-ui, sans-serif; z-index: 50; }
      .dark #splash { background: #0b0d12; }
      #splash img { width: min(300px, 78vw); height: auto; }
      #splash h1 { margin: 10px 0 2px; font-size: 20px; font-weight: 700; color: var(--brand, #1d45d8); text-align: center; padding: 0 16px; }
      .dark #splash h1 { color: color-mix(in oklab, var(--brand, #1d45d8) 45%, white); }
      #splash p { margin: 0; color: #64748b; font-size: 14px; }
      #splash footer { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
        font-size: 12px; line-height: 1.6; color: #94a3b8; }
      #splash footer b { color: #64748b; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/illustration.svg" alt="" width="520" height="360" />
      <h1>EasyJar</h1>
      <p>Jar Management</p>
      <footer>
        Developed by <b>AB Technology</b><br />
        7666287015 · abtechservices.store
      </footer>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
