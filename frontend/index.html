<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d45d8" />
    <meta name="description" content="EasyJar – जार व्यवस्थापन" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Install: the manifest is served per company by the API (src/lib/branding.js switches it after login). -->
    <link rel="manifest" href="/api/manifest.webmanifest" />

    <!-- iPhone: install to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EasyJar" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Inter (Latin) + Noto Sans Devanagari (Marathi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>EasyJar</title>
    <script>
      // Before first paint: dark mode (same rule as src/lib/theme.js) and the saved company
      // branding (same data as src/lib/branding.js), so there is no white flash and an
      // installed company app opens with its own name, logo and manifest.
      try {
        var t = localStorage.getItem('rws_theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var b = JSON.parse(localStorage.getItem('rws_branding') || 'null');
        if (b) {
          var mr = localStorage.getItem('rws_lang') !== 'en';
          window.__brandName = (mr && b.name_mr) || b.name;
          window.__brandLogo = b.logo_url || (b.icons && b.icons['icon-192']);
          document.title = window.__brandName;
          var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el && val) el.setAttribute(attr, val); };
          set('link[rel="manifest"]', 'href', b.manifest_url);
          set('link[rel="apple-touch-icon"]', 'href', b.icons && b.icons['apple-touch']);
          set('meta[name="apple-mobile-web-app-title"]', 'content', b.short_name);
        }
      } catch (e) {}
    </script>
    <style>
      /* Splash shown instantly while the app loads (also on iPhone, which has no manifest splash). */
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f5f6f8; font-family: system-ui, sans-serif; z-index: 50; }
      .dark #splash { background: #0b0d12; }
      #splash img { width: 88px; height: 88px; border-radius: 22px; object-fit: contain; box-shadow: 0 10px 30px rgba(15,23,42,.14); }
      #splash h1 { margin: 18px 0 2px; font-size: 20px; font-weight: 700; color: var(--brand, #1d45d8); text-align: center; padding: 0 16px; }
      .dark #splash h1 { color: color-mix(in oklab, var(--brand, #1d45d8) 45%, white); }
      #splash p { margin: 0; color: #64748b; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icons/icon-192.png" alt="" />
      <h1>EasyJar</h1>
      <p>जार व्यवस्थापन</p>
    </div>
    <script>
      try {
        if (window.__brandName) document.querySelector('#splash h1').textContent = window.__brandName;
        if (window.__brandLogo) document.querySelector('#splash img').src = window.__brandLogo;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
